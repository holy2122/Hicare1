# GitHub에 push / PR 할 때마다 실제로 설치 + 빌드가 되는지 자동 확인합니다.
# 결과는 GitHub 저장소의 "Actions" 탭에서 ✅/❌ 로 볼 수 있습니다.
name: Build check
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Type check (참고용, 실패해도 배포 빌드는 막지 않음)
        run: pnpm run check
        continue-on-error: true
      - name: Build
        run: pnpm run build
      - name: 콘텐츠 원본이 배포물에 포함되지 않았는지 확인
        run: test ! -f dist/public/healthData.json
